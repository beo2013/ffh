<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web của hack</title>
    
    <style>
        /* Kịch bản đổi qua 4 màu */
        @keyframes doiNhieuMau {
            0% {
                background-color: yellow; /* 1. Vàng */
            }
            25% {
                background-color: red;    /* 2. Đỏ */
            }
            50% {
                background-color: green;  /* 3. Xanh lá */
            }
            75% {
                background-color:  light blue;   /* 4. Xanh dương */
            }
        }

        body {
            /* 4 màu x 2 giây = s cho 1 chu kỳ */
            animation: doiNhieuMau 8s infinite;
            color: black; /* Đổi màu chữ sang trắng cho dễ đọc */
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>Chào mừng bạn đã bị lừa !</h1>
    <p>you đang bị hack</p>
    
    <img src="https://picsum.photos/400/250" alt="Hình ảnh phong cảnh ngẫu nhiên" width="400">

    <hr>

        <img src="./hello.png" alt="tron tron vn" width="200">
    </a>

</body>
</html>
